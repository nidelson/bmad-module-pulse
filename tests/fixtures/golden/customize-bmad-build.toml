# PULSE auto-tracking — track-start + track-done hooks (unified architecture)
#
# This file is generated by `bmad-pulse-setup`. Edit at your own risk: re-running
# `/bmad-pulse-setup` aborts when this file already exists; pass `--force` to
# regenerate, which overwrites your edits.
#
# On the unified `bmad-build` architecture both hooks live in one file, because
# implementation and review happen inside a single workflow. On the split
# architecture they are two files — `bmad-dev-story.toml` (start) and
# `bmad-code-review.toml` (done). Emitting the split pair on a `bmad-build`
# project is silent breakage: the overrides land in workflows the user no longer
# invokes, the setup still reports success, and no metric is ever recorded.
#
# NOTE ON `on_complete`: it is a string that REPLACES, not a list that appends.
# Any other module writing this same key on `bmad-build` overwrites these
# instructions rather than adding to them. Chain, do not clobber.

[workflow]

activation_steps_append = [
  "PULSE auto-tracking: invoke the bmad-pulse-track-start skill BEFORE implementation begins, once routing has established that this run will actually implement an epic story. Resolve the story_id from the frontmatter of the spec file this workflow resolved — the workflow names this variable spec_file. Pass the story_id explicitly, e.g. /bmad-pulse-track-start 15.3. The skill is idempotent — if a start_ts already exists in pulse_metrics: for this story, it asks before overwriting. Skip the invocation entirely when the run does not implement an epic story: clarification-only, exploratory, and freeform (spec-without-epic) routes have no story id or estimate to track, and recording them pollutes the metric with data that cannot measure leverage.",
]

on_complete = "PULSE auto-tracking: invoke the bmad-pulse-track-done skill, passing the story_id of the just-built story as argument (e.g. /bmad-pulse-track-done 15.3). The skill records end_ts, calculates the AI Leverage Ratio, and displays the Efficiency Pulse. It will interactively prompt for review_cycles and (optionally) effective_hours — wait for the user's response. Pre-requisite: a start_ts must exist in pulse_metrics: for this story (recorded by the activation step above); if absent, the skill warns and suggests running track-start first. Completion is genuine here rather than premature: unlike the split architecture — where bmad-dev-story ends at status \"review\" and only bmad-code-review reaches \"done\" — review has already run inside this workflow via workflow.review_layers."

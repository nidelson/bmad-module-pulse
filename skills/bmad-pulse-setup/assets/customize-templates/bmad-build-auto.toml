# PULSE auto-tracking for the unattended loop (`bmad-build-auto`)
#
# This file is generated by `bmad-pulse-setup`. Edit at your own risk: re-running
# `/bmad-pulse-setup` aborts when this file already exists; pass `--force` to
# regenerate, which overwrites your edits.
#
# WHY THIS FILE EXISTS. `bmad-build-auto` is the skill an orchestrator (e.g.
# `bmad-loop`) invokes to run a story unattended. It is a DIFFERENT skill
# directory from `bmad-build`, and customization resolves per skill name —
# `load_customization()` reads `_bmad/custom/<skill-name>.toml`. A project with
# `bmad-build.toml` installed and no file here gets no measurement at all on the
# automated route: the story ships and PULSE never hears about it. Nothing
# errors, because an absent customization file is a valid state.
#
# THE UNATTENDED RUN IS THE BETTER MEASUREMENT, not a degraded one. `track-done`
# asks a human three questions because in an interactive session only the human
# knows the answers. Here the workflow itself does, and its answers are more
# reliable than a person's recollection:
#
#   - `review_cycles` is recorded, pass by pass, in the `## Review Triage Log`
#     section this workflow appends to `{spec_file}`. Counting rows beats asking
#     someone to remember.
#   - `effective_hours` exists to strip human idle time out of wall-clock. There
#     is no human in the loop, so wall-clock already IS effective time.
#   - `halts` are approval waits, incidents and user-initiated pauses. Nobody is
#     being asked for approval, so on a clean run there are genuinely none —
#     that is the true answer, not a refusal to answer.
#
# So the instruction below tells the workflow to REPORT WHAT IT OBSERVED. The
# one thing it must not do is invent: a fabricated halt is subtracted from
# `actual_hours` and silently inflates leverage, which is exactly the corruption
# this module exists to prevent.
#
# ONE GATE THAT MATTERS: the workflow can run in two legs. With
# `spec_checkpoint` enabled, leg 1 plans and halts at `ready-for-dev` having
# implemented nothing; leg 2 implements. Both legs execute these activation
# steps. Stamping `start_ts` on leg 1 would put the human checkpoint wait —
# minutes or days — inside `actual_hours` as if it were development.

[workflow]

activation_steps_append = [
  "PULSE auto-tracking — DEFERRED TRIGGER, register it now and fire it later. Milestone: in step-03 (implement), at the point where the workflow follows `sync-sprint-status.md` with `target_status` = `in-progress`, and BEFORE executing the implementation handoff, invoke the bmad-pulse-track-start skill passing the story_id explicitly (e.g. /bmad-pulse-track-start 15.3). Derive the story_id from the frontmatter of `{spec_file}` — never from the `in-progress` field of sprint-status, because this workflow just wrote that field and reading it back would be circular. The skill is idempotent: if a start_ts already exists for this story it asks before overwriting, and in an unattended run the answer is to keep the existing value. SKIP the invocation entirely, without error, when any of these hold: this run is a planning leg that ends at `ready-for-dev` without implementing (implementation has not started, and stamping it here would count the checkpoint wait as development time); `story_key` could not be resolved (no key, nowhere to record the metric); or the story is exploratory/read-only with no real implementation.",
]

on_complete = "PULSE auto-tracking: invoke the bmad-pulse-track-done skill, passing the story_id of the just-built story as argument (e.g. /bmad-pulse-track-done 15.3). It records end_ts, calculates the AI Leverage Ratio and writes actual_hours.\n\nThe skill will ask three questions that normally need a human. This run is unattended, and you have better answers than a human would — supply them from what the run actually did, and never from a guess:\n\n- `review_cycles`: count the entries this run appended to the `## Review Triage Log` section of `{spec_file}` — one per review pass. That log is the record of what happened; do not estimate. If the review step ran once and passed, the answer is 1. A resumed or follow-up pass counts the passes THIS run performed, not the rows carried over from an earlier one.\n- `effective_hours`: do NOT supply a value. This field exists to strip human idle time out of wall-clock, and an unattended run has none — wall-clock already is the effective working time. Supplying a number here would override a good measurement with an invented one.\n- halts: report the ones the run actually recorded, and only those. A halt is a blocking pause over two minutes — an approval wait, an incident, an external pause. An unattended run asks nobody for approval, so on a clean run the honest answer is none. Never invent one to look thorough: halts are SUBTRACTED from actual_hours, so a fabricated halt inflates the leverage ratio and corrupts the baseline for every story scored after it.\n\nSkip the invocation entirely, without error, when `story_key` never resolved, or when this run implemented nothing (a planning-only leg has no completion to record)."

# PULSE auto-tracking + BCP recalibrate (unified architecture, scoring enabled)
#
# This file is generated by `bmad-pulse-setup`. Edit at your own risk: re-running
# `/bmad-pulse-setup` aborts when this file already exists; pass `--force` to
# regenerate, which overwrites your edits.
#
# Emitted INSTEAD OF `bmad-build.toml` when `pulse_estimation_method = "bcp"`.
# The two files share a destination; only one is ever written. A project that
# does not use BCP scoring never receives the recalibrate step at all — not even
# as an instruction that checks and skips.
#
# WHY THE STEPS ARE IN ONE STRING. `on_complete` is a scalar: an override
# REPLACES it rather than appending. Until this file existed, PULSE wrote the
# track-done instruction and the BCP module appended its own with a merge pass,
# leaving the ordering constraint expressed as a sentence inside the text
# ("execute only after the previous instructions have completed") and dependent
# on which module was installed last. Both halves now live here, in order,
# authored as one sequence. The ordering is not a request — it is the file.

[workflow]

activation_steps_append = [
  "PULSE auto-tracking: invoke the bmad-pulse-track-start skill BEFORE implementation begins, once routing has established that this run will actually implement an epic story. Resolve the story_id from the frontmatter of the spec file this workflow resolved — the workflow names this variable spec_file. Pass the story_id explicitly, e.g. /bmad-pulse-track-start 15.3. The skill is idempotent — if a start_ts already exists in pulse_metrics: for this story, it asks before overwriting. Skip the invocation entirely when the run does not implement an epic story: clarification-only, exploratory, freeform (spec-without-epic), and one-shot routes have no story id or estimate to track, and recording them pollutes the metric with data that cannot measure leverage.",
]

on_complete = "Run these two steps in order; the second depends on the first having finished.\n\nSTEP 1 — PULSE track-done. Invoke the bmad-pulse-track-done skill, passing the story_id of the just-built story as argument (e.g. /bmad-pulse-track-done 15.3). The skill records end_ts, calculates the AI Leverage Ratio, and displays the Efficiency Pulse. It will interactively prompt for review_cycles and (optionally) effective_hours — wait for the user's response before continuing. Pre-requisite: a start_ts must exist in pulse_metrics: for this story (recorded by the activation step above); if absent, the skill warns and suggests running track-start first. Completion is genuine here rather than premature: review has already run inside this workflow via workflow.review_layers.\n\nSTEP 2 — BCP recalibrate. Only after STEP 1 has fully completed, including the interactive prompts and the write of actual_hours to sprint-status. Check whether the story carries bcp.total in its frontmatter. If it does, read actual_hours from the pulse_metrics section of sprint-status (keyed by the story's story_key or story_id) — that field only exists once track-done has finished. If actual_hours is present and is a valid number, invoke the bmad-bcp-recalibrate skill passing the story path and --actual-hours with the value read (e.g. /bmad-bcp-recalibrate --story path/to/story.md --actual-hours 0.48). Recalibration is idempotent — samples already applied are skipped by story id. If bcp.total is absent, actual_hours is not found, or STEP 1 did not run, skip silently: no error, no recalibration attempt."

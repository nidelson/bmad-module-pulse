# BCP scoring hook — bmad-create-story (scoring enabled)
#
# This file is generated by `bmad-pulse-setup`. Edit at your own risk: re-running
# `/bmad-pulse-setup` aborts when this file already exists; pass `--force` to
# regenerate, which overwrites your edits.
#
# There is no plain (non-BCP) counterpart to this template. PULSE has nothing to
# say to `bmad-create-story` unless scoring is on — tracking hooks attach to the
# implementation workflow, not to story authoring.
#
# ARCHITECTURE-INDEPENDENT, unlike every other template here. The tracking hooks
# split by capability because implementation moved: `bmad-dev-story` +
# `bmad-code-review` on the split architecture, `bmad-build` on the unified one.
# Story authoring did not move. `bmad-create-story` is the same core skill under
# both, and `bmad-build` does not replace it — it writes a *spec* (frontmatter:
# title, type, status) and consumes a story only by `story_key`. There is no
# `estimated_hours` on a spec to derive, so scoring has exactly one correct home
# and it is this one.
#
# WHY `persistent_facts` AND NOT `on_complete`: it is a list that appends, so
# this composes with whatever else the workflow or another module put there.
# `on_complete` is a scalar that replaces — see `bmad-build.bcp.toml` for what
# that costs.
#
# WHY AT STORY CREATION AND NOT LATER: `estimated_hours` derived after the work
# is not an estimate, and every downstream number treats it as one. The
# leverage-vs-reference figure divides by it; `estimate_error_pct` measures
# distance from it; recalibration feeds the real hours back against it. Score
# late and all three describe a prediction that already knew the answer.

[workflow]

persistent_facts = [
  "BCP scoring is enabled. After the bmad-create-story workflow has written the story file — frontmatter carrying story_id, category and estimated_hours — invoke the bmad-bcp-score skill with the story path as its argument (e.g. /bmad-bcp-score docs/stories/5.7.md) BEFORE finishing. Scoring runs non-interactively above the confidence threshold (bcp_confidence_threshold); it opens a dry-run review only on divergence from the estimate already in the file, on low confidence, or on a rescore. The skill is idempotent and preserves the audit trail: the pre-existing value is kept in estimated_hours_pre_bcp and estimated_hours_basis records who produced the number. Skip the invocation for a spike or exploratory story with no implementation to estimate — a score there is a number about work that will not happen, and it enters the baseline as a sample like any other.",
]

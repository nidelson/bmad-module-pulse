# PULSE track-done + BCP recalibrate (split architecture, scoring enabled)
#
# This file is generated by `bmad-pulse-setup`. Edit at your own risk: re-running
# `/bmad-pulse-setup` aborts when this file already exists; pass `--force` to
# regenerate, which overwrites your edits.
#
# Emitted INSTEAD OF `bmad-code-review.toml` when `pulse_estimation_method = "bcp"`.
# The two files share a destination; only one is ever written. A project that
# does not use BCP scoring never receives the recalibrate step.
#
# The split architecture's counterpart to `bmad-build.bcp.toml`. Track-start
# still lives in `bmad-dev-story.toml`, because bmad-dev-story ends at status
# "review" and only bmad-code-review reaches "done" — invoking track-done from
# the former corrupts metrics with premature recording.
#
# See `bmad-build.bcp.toml` for why both steps are authored as one string rather
# than merged from two modules.

[workflow]

on_complete = "Run these two steps in order; the second depends on the first having finished.\n\nSTEP 1 — PULSE track-done. Invoke the bmad-pulse-track-done skill, passing the story_id of the just-reviewed story as argument (e.g. /bmad-pulse-track-done 15.3). The skill records end_ts, calculates the AI Leverage Ratio, and displays the Efficiency Pulse. It will interactively prompt for review_cycles and (optionally) effective_hours — wait for the user's response before continuing. Pre-requisite: a start_ts must exist in pulse_metrics: for this story (recorded by bmad-dev-story); if absent, the skill warns and suggests running track-start first.\n\nSTEP 2 — BCP recalibrate. Only after STEP 1 has fully completed, including the interactive prompts and the write of actual_hours to sprint-status. Check whether the story carries bcp.total in its frontmatter. If it does, read actual_hours from the pulse_metrics section of sprint-status (keyed by the story's story_key or story_id) — that field only exists once track-done has finished. If actual_hours is present and is a valid number, invoke the bmad-bcp-recalibrate skill passing the story path and --actual-hours with the value read (e.g. /bmad-bcp-recalibrate --story path/to/story.md --actual-hours 0.48). Recalibration is idempotent — samples already applied are skipped by story id. If bcp.total is absent, actual_hours is not found, or STEP 1 did not run, skip silently: no error, no recalibration attempt."

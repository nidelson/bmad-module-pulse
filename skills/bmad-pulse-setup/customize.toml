# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for bmad-pulse-setup. Setup is a one-shot
# install skill; the surface is kept minimal for uniformity with the rest
# of the bmm/PULSE ecosystem rather than because there are many extension
# points to expose.

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (capability gate, config load).
# Overrides append. Use for pre-flight loads such as fetching org-wide
# defaults before the interactive prompts begin.

activation_steps_prepend = []

# Steps to run after activation but before the workflow begins writing
# config files. Overrides append. Use for context-heavy setup such as
# fetching team-wide defaults from an external source.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run
# (default values to suggest, naming conventions to follow).
# Distinct from the runtime memory sidecar — these are static context
# loaded on activation. Overrides append.
#
# Each entry is either:
#   - a literal sentence, e.g. "Default pulse_estimation_method to story_points."
#   - a file reference prefixed with `file:`, e.g. "file:{project-root}/docs/install-prefs.md"
#     (glob patterns are supported; the file's contents are loaded and treated as facts).

persistent_facts = []

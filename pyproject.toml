# The module ships no installable Python package — its scripts run via
# `python3 script.py` inside consumer projects with zero runtime deps
# (`dependencies = []` in each script header). The only Python deps in this
# repo are for the test suite, declared here as a PEP 735 dependency group.
# Run the suite with: `uv run --group test pytest`
[dependency-groups]
test = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "tomlkit>=0.13",
    # `bcp-frontmatter.schema.yaml` ships as a versioned contract; jsonschema is
    # what makes it enforced rather than documentation with a .yaml extension.
    "jsonschema>=4.0",
]

[tool.pytest.ini_options]
# `skills` is here because the BCP scoring scripts keep their tests next to the
# code they exercise (`skills/bmad-bcp-score/scripts/tests/`). Without it those
# 794 lines are collected by nothing and CI stays green having run none of them.
testpaths = ["skills", "tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests that spin up a fake consumer project",
]
